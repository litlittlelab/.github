name: Decision
description: A decision that should become an ADR in litlittlelab-ops/adr
title: "Decision: "
labels: ["needs-decision"]
body:
  - type: textarea
    id: context
    attributes: { label: Context }
    validations: { required: true }
  - type: textarea
    id: options
    attributes: { label: Options considered }
  - type: textarea
    id: decision
    attributes: { label: Decision (fill in once decided) }
  - type: markdown
    attributes: { value: "Once decided: add adr/NNNN-title.md in litlittlelab-ops and post one line in #decisions." }
